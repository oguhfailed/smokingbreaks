<!DOCTYPE html>
<html lang="en">
<head>

  <title>Õismäe Cycle Lanes — Spare Land Proposals</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111;
      color: #e8e8e8;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #1a2a1a;
      border-bottom: 2px solid #2d6a2d;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.25rem;
      color: #5dca5d;
      letter-spacing: 1px;
    }

    header .subtitle {
      font-size: 0.82rem;
      color: #7a9e7a;
    }

    .badge {
      margin-left: auto;
      background: #2d6a2d;
      color: #a8f0a8;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: #161616;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .sidebar-scroll::-webkit-scrollbar { width: 6px; }
    .sidebar-scroll::-webkit-scrollbar-track { background: #111; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .section-title {
      font-size: 0.7rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 14px 0 8px 0;
    }

    .section-title:first-child { margin-top: 0; }

    /* ── Route toggle cards ── */
    .route-card {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }

    .route-card:hover { border-color: #444; }

    .route-card.active {
      border-color: var(--route-color);
      background: #1e2a1e;
    }

    .route-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .route-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--route-color);
      flex-shrink: 0;
    }

    .route-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #ddd;
      flex: 1;
    }

    .route-toggle {
      font-size: 0.7rem;
      color: #666;
    }

    .route-card.active .route-toggle { color: #a8f0a8; }

    .route-meta {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .meta-pill {
      font-size: 0.67rem;
      background: #252525;
      color: #888;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .route-desc {
      font-size: 0.75rem;
      color: #777;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ── Spare land cards ── */
    .land-card {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .land-card:hover { border-color: #444; }
    .land-card.active { border-color: #4a9e4a; }

    .land-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .land-icon { font-size: 1rem; }
    .land-name { font-size: 0.85rem; color: #ccc; flex: 1; }

    .land-desc {
      font-size: 0.73rem;
      color: #666;
      margin-top: 5px;
      line-height: 1.4;
    }

    /* ── Stats panel ── */
    .stats-panel {
      padding: 12px 14px;
      background: #121212;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 5px;
    }

    .stat-label { color: #666; }
    .stat-value { color: #a8f0a8; font-weight: bold; }

    /* ── Map ── */
    #map {
      flex: 1;
      background: #0d1a0d;
    }

    /* ── Info popup on map ── */
    .leaflet-popup-content-wrapper {
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      color: #ddd;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .leaflet-popup-tip { background: #1a1a1a; }

    .popup-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #5dca5d;
      margin-bottom: 6px;
    }

    .popup-body {
      font-size: 0.8rem;
      color: #bbb;
      line-height: 1.6;
    }

    .popup-tag {
      display: inline-block;
      background: #2a3a2a;
      color: #7dc97d;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 10px;
      margin: 4px 2px 0 0;
    }

    /* ── Legend ── */
    .map-legend {
      position: absolute;
      bottom: 28px;
      right: 10px;
      background: rgba(20,20,20,0.92);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
      z-index: 1000;
      font-size: 0.72rem;
      color: #bbb;
      min-width: 160px;
    }

    .legend-title {
      font-weight: bold;
      color: #5dca5d;
      margin-bottom: 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .legend-line {
      width: 28px;
      height: 4px;
      border-radius: 2px;
    }

    .legend-dash {
      width: 28px;
      height: 3px;
      border-radius: 2px;
      border-top: 3px dashed;
    }

    .legend-area {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      opacity: 0.6;
    }
  </style>
</head>

// ─────────────────────────────────────────────────────────
// MAP SETUP
// ─────────────────────────────────────────────────────────

const map = L.map("map", {
  center: CENTER,
  zoom: 14,
  zoomControl: true,
}).setView(CENTER, 14);

// Dark-toned OSM tile layer
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 19,
  subdomains: "abcd",
}).addTo(map);

// State
const routeLayers = {};   // id -> L.Polyline
const landLayers  = {};   // id -> L.Polygon
const activeRoutes = new Set(ROUTES.map(r => r.id));
const activeLands  = new Set(SPARE_LANDS.map(l => l.id));

// ─────────────────────────────────────────────────────────
// RENDER ROUTES
// ─────────────────────────────────────────────────────────

function routePopupHTML(r) {
  const tags = r.tags.map(t => `<span class="popup-tag">${t}</span>`).join("");
  return `
    <div class="popup-title">🚲 ${r.name}</div>
    <div class="popup-body">
      <b>Length:</b> ${r.lengthKm} km &nbsp;|&nbsp; <b>Type:</b> ${r.type}<br/>
      ${r.description}<br/>
      <div style="margin-top:6px">${tags}</div>
    </div>`;
}

ROUTES.forEach(r => {
  const line = L.polyline(r.coords, {
    color: r.color,
    weight: 5,
    opacity: 0.88,
    lineJoin: "round",
    lineCap: "round",
  }).addTo(map);

  line.bindPopup(routePopupHTML(r), { maxWidth: 280 });

  // Arrow direction hint via decorative offset line
  line.on("mouseover", () => line.setStyle({ weight: 7, opacity: 1 }));
  line.on("mouseout",  () => line.setStyle({ weight: 5, opacity: 0.88 }));

  routeLayers[r.id] = line;
});

// ─────────────────────────────────────────────────────────
// RENDER SPARE LANDS
// ─────────────────────────────────────────────────────────

function landPopupHTML(l) {
  return `
    <div class="popup-title">${l.icon} ${l.name}</div>
    <div class="popup-body">
      <b>Area:</b> ${l.area}<br/>
      ${l.description}
    </div>`;
}

SPARE_LANDS.forEach(l => {
  const poly = L.polygon(l.coords, {
    color: l.color,
    fillColor: l.color,
    fillOpacity: 0.28,
    weight: 2,
    opacity: 0.7,
    dashArray: "6 4",
  }).addTo(map);

  poly.bindPopup(landPopupHTML(l), { maxWidth: 280 });

  poly.on("mouseover", () => poly.setStyle({ fillOpacity: 0.45 }));
  poly.on("mouseout",  () => poly.setStyle({ fillOpacity: 0.28 }));

  landLayers[l.id] = poly;
});

// ─────────────────────────────────────────────────────────
// SIDEBAR — ROUTE CARDS
// ─────────────────────────────────────────────────────────

function buildRouteSidebar() {
  const list = document.getElementById("route-list");
  list.innerHTML = "";

  ROUTES.forEach(r => {
    const card = document.createElement("div");
    card.className = "route-card" + (activeRoutes.has(r.id) ? " active" : "");
    card.style.setProperty("--route-color", r.color);

    const tags = r.tags.map(t => `<span class="meta-pill">${t}</span>`).join("");
    card.innerHTML = `
      <div class="route-header">
        <div class="route-dot"></div>
        <div class="route-name">${r.name}</div>
        <div class="route-toggle">${activeRoutes.has(r.id) ? "✓ on" : "off"}</div>
      </div>
      <div class="route-meta">
        <span class="meta-pill">${r.lengthKm} km</span>
        <span class="meta-pill">${r.type}</span>
        ${tags}
      </div>
      <div class="route-desc">${r.description}</div>
    `;

    card.addEventListener("click", () => toggleRoute(r.id, card));
    list.appendChild(card);
  });
}

function toggleRoute(id, card) {
  if (activeRoutes.has(id)) {
    activeRoutes.delete(id);
    map.removeLayer(routeLayers[id]);
    card.classList.remove("active");
    card.querySelector(".route-toggle").textContent = "off";
  } else {
    activeRoutes.add(id);
    routeLayers[id].addTo(map);
    card.classList.add("active");
    card.querySelector(".route-toggle").textContent = "✓ on";
  }
  updateStats();
}

      <div class="land-header">
        <div class="land-icon">${l.icon}</div>
        <div class="land-name">${l.name}</div>
        <div class="route-toggle" style="color:#666">${activeLands.has(l.id) ? "✓ on" : "off"}</div>
      </div>
      <div class="land-desc">${l.area} — ${l.description}</div>
    `;

    card.addEventListener("click", () => toggleLand(l.id, card));
    list.appendChild(card);
  });
}

function toggleLand(id, card) {
  if (activeLands.has(id)) {
    activeLands.delete(id);
    map.removeLayer(landLayers[id]);
    card.classList.remove("active");
    card.querySelector(".route-toggle").textContent = "off";
  } else {
    activeLands.add(id);
    landLayers[id].addTo(map);
    card.classList.add("active");
    card.querySelector(".route-toggle").textContent = "✓ on";
  }
  updateStats();
}

// ─────────────────────────────────────────────────────────
// STATS
// ─────────────────────────────────────────────────────────

function updateStats() {
  const totalKm = ROUTES
    .filter(r => activeRoutes.has(r.id))
    .reduce((s, r) => s + r.lengthKm, 0);

  document.getElementById("stat-length").textContent =
    totalKm.toFixed(1) + " km";
  document.getElementById("stat-active").textContent =
    `${activeRoutes.size} / ${ROUTES.length}`;
  document.getElementById("stat-land").textContent =
    `${activeLands.size} / ${SPARE_LANDS.length} zones`;
}

// ─────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────

buildRouteSidebar();
buildLandSidebar();
updateStats();

// Fly to Õismäe centre marker
const centre = L.circleMarker(CENTER, {
  radius: 8,
  color: "#00cc55",
  fillColor: "#00cc55",
  fillOpacity: 0.7,
  weight: 2,
}).addTo(map)
  .bindPopup("<div class='popup-title'>📍 Õismäe Centre</div><div class='popup-body'>West Tallinn residential district<br>59.4168°N, 24.6345°E</div>");
</script>
